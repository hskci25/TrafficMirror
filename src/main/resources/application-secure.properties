# TrafficMirror Secure Configuration Example
# This configuration demonstrates how to properly secure traffic mirroring

# Basic Configuration
traffic-mirror.enabled=true
traffic-mirror.forward-url=https://your-ngrok-url.ngrok.io
traffic-mirror.path-patterns[0]=/api/**
traffic-mirror.path-patterns[1]=/v1/**

# JWT Security Configuration
traffic-mirror.security.jwt-enabled=true
traffic-mirror.security.jwt-secret=${JWT_SECRET:your-256-bit-secret-key-here}
traffic-mirror.security.jwt-expiration-ms=3600000
traffic-mirror.security.jwt-issuer=your-company-traffic-mirror

# IP Restrictions
traffic-mirror.security.ip-restriction-enabled=true
traffic-mirror.security.allowed-ips[0]=192.168.1.100
traffic-mirror.security.allowed-ips[1]=10.0.0.50
traffic-mirror.security.allowed-ip-ranges[0]=192.168.1.0/24
traffic-mirror.security.allowed-ip-ranges[1]=10.0.0.0/16

# URL Validation
traffic-mirror.security.url-validation-enabled=true
traffic-mirror.security.allowed-domains[0]=your-ngrok-domain.ngrok.io
traffic-mirror.security.allowed-domains[1]=localhost
traffic-mirror.security.allowed-url-patterns[0]=https://.*\\.ngrok\\.io/.*
traffic-mirror.security.allowed-url-patterns[1]=https://localhost:.*

# Rate Limiting
traffic-mirror.security.rate-limiting-enabled=true
traffic-mirror.security.max-requests-per-minute=10
traffic-mirror.security.max-requests-per-hour=100

# Developer Authorization
traffic-mirror.security.require-developer-auth=true
traffic-mirror.security.authorized-developers[0]=john.doe@company.com
traffic-mirror.security.authorized-developers[1]=jane.smith@company.com

# TLS Configuration
traffic-mirror.security.require-tls=true
traffic-mirror.security.validate-certificates=true

# Audit Configuration
traffic-mirror.audit.enabled=true
traffic-mirror.audit.log-request-body=false
traffic-mirror.audit.log-response-body=false
traffic-mirror.audit.log-headers=true
traffic-mirror.audit.audit-log-level=INFO
traffic-mirror.audit.persist-audit-logs=true
traffic-mirror.audit.audit-log-path=/var/log/traffic-mirror/audit.log

# Data Protection Configuration
traffic-mirror.data-protection.enabled=true
traffic-mirror.data-protection.mask-pii=true
traffic-mirror.data-protection.pii-fields[0]=ssn
traffic-mirror.data-protection.pii-fields[1]=email
traffic-mirror.data-protection.pii-fields[2]=phone
traffic-mirror.data-protection.pii-fields[3]=creditCard
traffic-mirror.data-protection.pii-fields[4]=password
traffic-mirror.data-protection.sensitive-headers[0]=Authorization
traffic-mirror.data-protection.sensitive-headers[1]=Cookie
traffic-mirror.data-protection.sensitive-headers[2]=X-API-Key
traffic-mirror.data-protection.encrypt-forwarded-data=true
traffic-mirror.data-protection.encryption-key=${ENCRYPTION_KEY:your-base64-encoded-aes-key}
traffic-mirror.data-protection.data-retention-days=7

# Environment Variables to Set:
# JWT_SECRET=your-256-bit-secret-key-here-make-it-long-and-random
# ENCRYPTION_KEY=base64-encoded-aes-256-key-for-data-encryption 